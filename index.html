<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班級大航海：無盡孤島</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #fff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes neonCyberpunk {
            0%, 100% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff,
                    0 0 20px #00e5ff, 0 0 40px #00e5ff, 0 0 80px #00e5ff;
                color: #fff;
            }
            33% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff,
                    0 0 20px #ffee00, 0 0 40px #ffee00, 0 0 80px #ffee00;
                color: #ffee00;
            }
            66% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff,
                    0 0 20px #d400ff, 0 0 40px #d400ff, 0 0 80px #d400ff;
                color: #d400ff;
            }
        }
        .neon-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 4px;
            animation: neonCyberpunk 3s infinite alternate;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
           /* ================= 大海與群島佈局 ================= */
        .ocean-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
               /* 模擬深海背景 */
            background: radial-gradient(circle at 50% 50%, #0c4a6e 0%, #294b84 50%, #82aeb7 100%);
            overflow: hidden;
        }

            /* 海浪波紋效果 (裝飾用) */
        .ocean-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0 10 Q 25 0 50 10 T 100 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/></svg>');
            background-size: 200px 100px;
            opacity: 0.5;
            pointer-events: none;
            animation: waveMove 10s linear infinite;
        }
        @keyframes waveMove {
            0% { background-position: 0 0; }
            100% { background-position: 200px 0; }
        }
        /* 群島容器 (使用相對定位，讓島嶼隨機散落) */
        .archipelago {
    position: relative;
    width: 100%;
    min-height: 85vh;
    padding: 40px 10px;
}
          /* ================= 單一島嶼 ================= */
       .island {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
    transform: translate(-50%, -50%);
}
         
        .island:hover {
            transform: translate(-50%, -50%) scale(1.05) translateY(-5px);
            z-index: 50;
        }
         /* 島嶼畫布 (圓形，無邊框) */
        .island-canvas {
            position: relative;
            width: 150px; /* 基礎大小 */
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
           /* 島嶼陸地 (填海效果) */
        .island-land {
            background-color: #22c55e;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.5s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 20px rgba(0,0,0,0.2);
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        .core-building {
            font-size: 3rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            z-index: 10;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
            transition: all 0.3s;
        }
        /* 學生資訊 (顯示在建築物下方) */
        .student-info {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 15;
            width: 100%;
            pointer-events: none;
        }
        .student-name {
            font-size: 0.9rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
        .student-stats {
            font-size: 0.65rem;
            color: #e2e8f0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
            white-space: nowrap;
        }
        /* 微觀裝飾物 */
        .micro-item {
            position: absolute;
            font-size: 0.9rem;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
         /* ================= 天災與維修狀態特效 ================= */
        /* 1. 雷暴雨 (Stage 0, today_score -1~-5) */
        .disaster-storm .island-land {
            filter: brightness(0.7) grayscale(0.5);
        }
        .disaster-storm .core-building::after {
            content: '💨';
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 1.5rem;
            animation: smoke 2s infinite;
        }
        @keyframes smoke {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-20px) scale(1.5); opacity: 0; }
        }
        .lightning {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            opacity: 0;
            animation: flash 3s infinite;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes flash {
            0%, 95%, 100% { opacity: 0; }
            96%, 98% { opacity: 1; }
        }
        .disaster-kraken .island-land {
            background-color: #1a1a1a;
            border: 3px solid #ef4444;
            box-shadow: 0 0 20px #ef4444;
            animation: shake 0.5s infinite;
        }
        /* 2. 海怪大災難 (Stage 1) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .kraken-tentacle {
            position: absolute;
            font-size: 4rem;
            z-index: 20;
            animation: tentacleSwing 2s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes tentacleSwing {
            0%, 100% { transform: rotate(-10deg) translateY(0); }
            50% { transform: rotate(10deg) translateY(-5px); }
        }
        .disaster-ruin .island-land {
            background-color: #4a4a4a;
        }
        .repair-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fbbf24;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
            animation: blink 1s infinite;
            z-index: 30;
            border: 1px solid #fbbf24;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ================= 規則說明看板 ================= */
.rules-board {
    max-width: 900px;
    margin: 20px auto 40px;
    padding: 20px;
    background: rgba(15, 23, 42, 0.85);
    border: 2px solid #00e5ff;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
}

.rules-title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 900;
    color: #00e5ff;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
    margin-bottom: 16px;
    letter-spacing: 3px;
}

.rules-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}

.rule-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(30, 41, 59, 0.8);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #334155;
}

.rule-icon {
    font-size: 1.8rem;
    flex-shrink: 0;
}

.rule-name {
    font-size: 0.85rem;
    font-weight: bold;
    color: #fff;
}

.rule-exp {
    font-size: 0.7rem;
    color: #94a3b8;
}

.rules-note {
    text-align: center;
    font-size: 0.8rem;
    color: #cbd5e1;
    padding-top: 10px;
    border-top: 1px dashed #334155;
}

/* 手機版調整：一行 2 個 */
@media (max-width: 600px) {
    .rules-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .rule-icon {
        font-size: 1.5rem;
    }
    .rule-name {
        font-size: 0.75rem;
    }
}

        /* ================= 手動更新按鈕 ================= */
    .refresh-btn {
    position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 15px 24px;
        background: #00e5ff;
        color: #000;
        border: none;
        border-radius: 50px;
        font-weight: 900;
        font-size: 1rem;
        font-family: 'Noto Sans TC', sans-serif;
        box-shadow: 0 0 20px #00e5ff, 0 4px 10px rgba(0,0,0,0.4);
        cursor: pointer;
        z-index: 999;
        transition: transform 0.2s, box-shadow 0.2s;
        letter-spacing: 1px;
    }
    .refresh-btn:active {
        transform: scale(0.9);
        box-shadow: 0 0 30px #00e5ff;
    }
    .refresh-btn:hover {
        box-shadow: 0 0 30px #00e5ff, 0 0 60px rgba(0, 229, 255, 0.5);
    }
        
    </style>
</head>
<body>

    <div class="ocean-container">
        <h1 class="neon-title pt-8">班級大航海<br>無盡孤島</h1>
<div class="text-center text-cyan-400 text-sm mb-4 font-bold tracking-widest">CLASS CASTAWAY</div>

<!-- ★★★ 規則說明看板 ★★★ -->
<div class="rules-board">
    <h2 class="rules-title">⚓ 航海指南 ⚓</h2>
    <div class="rules-grid">
        <div class="rule-item">
            <div class="rule-icon">🪨</div>
            <div class="rule-text">
                <div class="rule-name">LV0 荒蕪</div>
                <div class="rule-exp">0 EXP</div>
            </div>
        </div>
        <div class="rule-item">
            <div class="rule-icon">⛺</div>
            <div class="rule-text">
                <div class="rule-name">LV1 荒島</div>
                <div class="rule-exp">1 ~ 20 EXP</div>
            </div>
        </div>
        <div class="rule-item">
            <div class="rule-icon">🏕️</div>
            <div class="rule-text">
                <div class="rule-name">LV2 營地</div>
                <div class="rule-exp">21 ~ 45 EXP</div>
            </div>
        </div>
        <div class="rule-item">
            <div class="rule-icon">🏰</div>
            <div class="rule-text">
                <div class="rule-name">LV3 部落</div>
                <div class="rule-exp">46 ~ 90 EXP</div>
            </div>
        </div>
        <div class="rule-item">
            <div class="rule-icon">🏙️</div>
            <div class="rule-text">
                <div class="rule-name">LV4 城鎮</div>
                <div class="rule-exp">91 ~ 150 EXP</div>
            </div>
        </div>
        <div class="rule-item">
            <div class="rule-icon">🌆</div>
            <div class="rule-text">
                <div class="rule-name">LV5 帝國</div>
                <div class="rule-exp">151+ EXP</div>
            </div>
        </div>
    </div>
    <div class="rules-note">
        🌸 每 1~2 點 EXP 生成花草 ｜ 🌴 每 3~4 點 EXP 生成樹木 ｜ 🤖 每 5~6 點 EXP 生成動物與機械
    </div>
</div>

<div class="archipelago" id="archipelago"></div>
    <!-- ★★★ 手動更新按鈕插在這裡 ★★★ -->
        <button onclick="fetchStudents()" class="refresh-btn">🔄 更新</button>
</div>

    <script>
        // ★★★ 請把這裡改成您的 Apps Script Web App 網址 ★★★
        const API_URL = 'https://script.google.com/macros/s/AKfycbylCeRYjGoQajZ7XZIm6E5zWXxmXDMbegq0lv51Xg1Am0_Mq4TxaCtKZREBYUawn6W2dw/exec';

        const LEVELS = [
            { level: 0, name: '荒蕪', maxExp: 0, size: 20, building: '🪨' },
            { level: 1, name: '荒島', maxExp: 20, size: 45, building: '⛺' },
            { level: 2, name: '營地', maxExp: 45, size: 70, building: '🏕️' },
            { level: 3, name: '部落', maxExp: 90, size: 95, building: '🏰' },
            { level: 4, name: '城鎮', maxExp: 150, size: 120, building: '🏙️' },
            { level: 5, name: '帝國', maxExp: Infinity, size: 145, building: '🌆' }
        ];

        let students = [];

    function getLevelInfo(exp) {
    // 從最低等開始往上找，找到第一個符合的等級
    // LV0: exp = 0
    // LV1: 1 <= exp <= 20
    // LV2: 21 <= exp <= 45
    // LV3: 46 <= exp <= 90
    // LV4: 91 <= exp <= 150
    // LV5: exp >= 151
    if (exp <= 0) return LEVELS[0];
    for (let i = 1; i < LEVELS.length; i++) {
        if (exp <= LEVELS[i].maxExp) {
            return LEVELS[i];
        }
    }
    return LEVELS[LEVELS.length - 1];
}

        function renderOcean() {
    const container = document.getElementById('archipelago');
    container.innerHTML = '';

    // 找出最高分
    let maxExp = -1;
    students.forEach(s => { if (s.total_exp > maxExp) maxExp = s.total_exp; });

    // 容器實際寬高
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;

    // 島嶼由下往上排列：先決定每個島嶼的「列」
    // 假設一行最多 4 個，共 4 行
    const cols = 4;
    const rows = Math.ceil(students.length / cols);

    students.forEach((student, index) => {
        const levelInfo = getLevelInfo(student.total_exp);
        const landSize = levelInfo.size;

        // 計算這個島嶼在第幾列、第幾欄
        const col = index % cols;
        const row = Math.floor(index / cols);

        // 基礎位置（由上往下算，但我們要讓第一列在最下面，所以反過來）
        // row 0 放最底，row (rows-1) 放最頂
        const rowFromBottom = row;

        // 基礎 X 座標：平均分佈在容器寬度內
        const baseX = (containerWidth / cols) * (col + 0.5);

        // 基礎 Y 座標：從底部往上
        const baseY = containerHeight - ((containerHeight / rows) * (rowFromBottom + 0.5));

        // 加入隨機偏移，讓島嶼不要對齊
        const offsetX = (Math.random() - 0.5) * (containerWidth / cols) * 0.5;
        const offsetY = (Math.random() - 0.5) * (containerHeight / rows) * 0.5;

        const posX = baseX + offsetX;
        const posY = baseY + offsetY;

        // 天災狀態
        let disasterClass = '';
        let extraHTML = '';

        if (student.repair_stage === 1) {
            disasterClass = 'disaster-kraken';
            extraHTML += `<div class="kraken-tentacle" style="top: -20px; left: -20px;">🐙</div>`;
            extraHTML += `<div class="kraken-tentacle" style="bottom: -20px; right: -20px; transform: scaleX(-1);">🐙</div>`;
        } else if (student.repair_stage === 2) {
            disasterClass = 'disaster-ruin';
            extraHTML += `<div class="repair-warning">🚧 維修中...</div>`;
        } else if (student.today_score <= -6) {
            disasterClass = 'disaster-kraken';
        } else if (student.today_score < 0) {
            disasterClass = 'disaster-storm';
            extraHTML += `<div class="lightning"></div>`;
        }

        // ★★★ 新的裝飾物生成規則 ★★★
        let microItemsHTML = '';
        const exp = student.total_exp;

        // 隨機在圓形範圍內取點
        function randomPosition() {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 42; // 0~42% 半徑
            return {
                x: 50 + Math.cos(angle) * radius,
                y: 50 + Math.sin(angle) * radius
            };
        }

        // 規則 1：每 1~2 點 EXP，生成花朵或綠草
        const flowerCount = Math.floor(exp / 1) + Math.floor(exp / 2);
        for (let i = 0; i < flowerCount && i < 20; i++) {
            const pos = randomPosition();
            const emoji = Math.random() < 0.5 ? '🌸' : '🌿';
            microItemsHTML += `<div class="micro-item" style="left: ${pos.x}%; top: ${pos.y}%; animation-delay: ${Math.random() * 2}s;">${emoji}</div>`;
        }

        // 規則 2：每 3~4 點 EXP，生成椰子樹或橡樹
        const treeCount = Math.floor(exp / 3) + Math.floor(exp / 4);
        for (let i = 0; i < treeCount && i < 12; i++) {
            const pos = randomPosition();
            const emoji = Math.random() < 0.5 ? '🌴' : '🌳';
            microItemsHTML += `<div class="micro-item" style="left: ${pos.x}%; top: ${pos.y}%; font-size: 1.1rem; animation-delay: ${Math.random() * 2}s;">${emoji}</div>`;
        }

        // 規則 3：每 5~6 點 EXP，生成動物、車、機械人
        const creatureCount = Math.floor(exp / 5) + Math.floor(exp / 6);
        const creatureEmojis = ['🐕', '🐓', '🚗', '🤖'];
        for (let i = 0; i < creatureCount && i < 10; i++) {
            const pos = randomPosition();
            const emoji = creatureEmojis[Math.floor(Math.random() * creatureEmojis.length)];
            microItemsHTML += `<div class="micro-item" style="left: ${pos.x}%; top: ${pos.y}%; font-size: 1rem; animation-delay: ${Math.random() * 2}s;">${emoji}</div>`;
        }

        // 皇冠
        let crownHTML = '';
        if (student.total_exp === maxExp && maxExp > 0) {
            crownHTML = `<div style="position: absolute; top: -20px; right: -10px; font-size: 2rem; z-index: 30; animation: float 2s infinite;">👑</div>`;
        }

        const island = document.createElement('div');
        island.className = `island ${disasterClass}`;
        island.style.left = `${posX}px`;
        island.style.top = `${posY}px`;
        island.style.width = `${landSize + 40}px`;
        island.style.height = `${landSize + 40}px`;

        island.innerHTML = `
            <div class="island-canvas" style="width: ${landSize}px; height: ${landSize}px;">
                ${extraHTML}
                <div class="island-land">
                    <div class="core-building">${levelInfo.building}</div>
                    ${microItemsHTML}
                    <div class="student-info">
                        <div class="student-name">${student.id}. ${student.name}</div>
                        <div class="student-stats">LV${levelInfo.level} ${levelInfo.name} | ${student.total_exp} EXP</div>
                    </div>
                </div>
                ${crownHTML}
            </div>
        `;
        container.appendChild(island);
    });
}

        // ★★★ 從 Google Sheets 讀取資料 ★★★
        async function fetchStudents() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                students = data;
                renderOcean();
            } catch (err) {
                console.error('讀取資料失敗：', err);
            }
        }

        // 每 10 秒更新一次
        //setInterval(fetchStudents, 10000);
        //window.addEventListener('load', fetchStudents);\
        
        // 只在頁面載入時抓一次，之後手動按按鈕更新
        window.addEventListener('load', fetchStudents);
    </script>
</body>
</html>
